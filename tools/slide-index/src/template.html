<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slides</title>
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --hover: #f5f5f4;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #e7e5e4;
        --muted: #a8a29e;
        --line: #292524;
        --hover: #1c1917;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 28px; margin: 0 0 32px; letter-spacing: -0.01em; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a {
      display: flex;
      gap: 24px;
      align-items: baseline;
      padding: 14px 8px;
      color: inherit;
      text-decoration: none;
    }
    a:hover { background: var(--hover); }
    a:hover span { color: var(--accent); }
    time {
      flex: none;
      width: 104px;
      color: var(--muted);
      font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .empty { padding: 14px 8px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Slides</h1>
    <ul>
      <!-- SLIDES:START --><!-- SLIDES:END -->
    </ul>
  </main>
</body>
</html>
